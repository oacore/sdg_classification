name: AKS deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ACR_NAME: corecontainers
  IMAGE_NAME: chars-sdg-classification
  RESOURCE_GROUP: core-chars
  AKS_CLUSTER_NAME: chars-kubernetes-cluster
  NAMESPACE: chars
  DEPLOYMENT_NAME: chars-sdg-classification

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04-arm
    environment: azure

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set image reference
        id: image
        run: |
          TAG=$(echo ${{ github.sha }} | cut -c1-7)
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "ref=${{ env.ACR_NAME }}.azurecr.io/aks-${{ env.IMAGE_NAME }}:$TAG" >> $GITHUB_OUTPUT

      - name: Docker ACR Login
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker build
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --push \
            -t ${{ steps.image.outputs.ref }} .

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER_NAME }} \
            --admin \
            --overwrite-existing

      - name: Deploy to AKS
        run: |
          export IMAGE="${{ steps.image.outputs.ref }}"
          envsubst < kube/deployment.yaml | kubectl apply -f -
          kubectl apply -f kube/service-internal.yaml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} \
            --namespace ${{ env.NAMESPACE }} \
            --timeout=600s

      - name: Verify final state
        run: |
          echo "--- Pods ---"
          kubectl get pods \
            --namespace ${{ env.NAMESPACE }} \
            --selector app=${{ env.DEPLOYMENT_NAME }} \
            -o wide
          echo "--- Deployment ---"
          kubectl get deployment ${{ env.DEPLOYMENT_NAME }} \
            --namespace ${{ env.NAMESPACE }}
